<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>사주 명식표</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; max-width: 1180px; margin: 40px auto; padding: 0 16px; background: #f5f5f7; color: #1d1d1f; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  p.desc { color: #666; margin-top: 0; font-size: 14px; }

  form { background: #fff; border-radius: 12px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  label { font-size: 12px; color: #444; font-weight: 600; white-space: nowrap; }
  input, select, textarea { padding: 7px 8px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; font-family: inherit; }

  #name { width: 100px; }
  #gender { width: 72px; }
  #birth { width: 100px; }
  #calendar { width: 72px; }
  #leap { width: 72px; }
  #seyunRange { width: 80px; }
  #wolunRange { width: 88px; }
  #loveStatus { width: 128px; }
  #time { width: 76px; }
  #time:disabled { background: #eee; color: #999; }
  #ganjiSelect { width: 220px; }
  #ganjiSelect:disabled { background: #eee; color: #999; }
  .field { position: relative; }
  .region-search-input { width: 170px; }
  .region-manual-input { width: 110px; }
  .region-search-input.warn { border-color: #d9a300; background: #fffbe8; }
  .region-warning { display: none; font-size: 11px; color: #a66a00; }
  .region-warning.show { display: block; }
  .region-suggest { display: none; position: absolute; top: 100%; left: 0; margin-top: 2px; background: #fff; border: 1px solid #ccc; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.12); min-width: 200px; max-height: 220px; overflow-y: auto; z-index: 20; }
  .region-suggest.open { display: block; }
  .region-suggest-row { padding: 7px 10px; font-size: 13px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
  .region-suggest-row:last-child { border-bottom: none; }
  .region-suggest-row:hover { background: #f5f5f7; }
  .or-field { flex-direction: row; align-items: center; padding-bottom: 8px; }
  .or-field .or-text { font-size: 13px; color: #888; white-space: nowrap; }
  .checkbox-field { flex-direction: row; align-items: center; gap: 6px; padding-bottom: 8px; }
  .checkbox-field label { white-space: nowrap; }

  textarea { resize: vertical; min-height: 70px; width: 100%; }
  .concern-field { margin-top: 12px; }

  .actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
  button { padding: 10px 20px; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; color: #fff; }
  button.btn-jeong { background: #0071e3; }
  button.btn-jeong:hover { background: #0060c0; }
  button.btn-ya { background: #d92d20; }
  button.btn-ya:hover { background: #b7241a; }
  button.secondary { background: #6e6e73; }
  button.secondary:hover { background: #57575c; }
  button:disabled { background: #c7c7cc; cursor: not-allowed; }
  button:disabled:hover { background: #c7c7cc; }

  .result-toolbar { display: flex; gap: 10px; margin-top: 24px; }
  .result-bottom-actions { margin-top: 18px; padding-top: 14px; border-top: 1px solid #333; display: flex; }

  .form-error { color: #c00; font-weight: 600; font-size: 13px; margin-top: 8px; }

  .layout { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .form-panel { flex: 1 1 620px; min-width: 480px; }
  .form-panel form:last-child { margin-bottom: 0; }

  .saved-side { flex: 1 1 280px; min-width: 260px; max-width: 340px; background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 1px 3px rgba(0,0,0,.08); display: flex; flex-direction: column; max-height: 720px; }
  .saved-side-title { font-size: 15px; font-weight: 700; margin: 0 0 10px; }
  .saved-search-input { width: 100%; margin-bottom: 10px; }
  .saved-list { flex: 1 1 auto; overflow-y: auto; min-height: 80px; }
  .saved-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 6px; border-bottom: 1px solid #f0f0f0; border-radius: 6px; cursor: pointer; }
  .saved-item:last-child { border-bottom: none; }
  .saved-item:hover { background: #f5f5f7; }
  .saved-item-label { font-size: 13px; line-height: 1.4; }
  .saved-item-delete { background: none; border: none; color: #999; font-size: 15px; padding: 4px 7px; cursor: pointer; border-radius: 6px; flex-shrink: 0; }
  .saved-item-delete:hover { color: #c00; background: #fdeceb; }
  .saved-empty { padding: 16px 4px; font-size: 13px; color: #888; text-align: center; }
  .saved-pagination { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #f0f0f0; }
  .saved-page-btn { padding: 5px 10px; border: 1px solid #ccc; background: #fff; color: #444; border-radius: 6px; font-size: 12px; cursor: pointer; }
  .saved-page-btn.active { background: #0071e3; color: #fff; border-color: #0071e3; }
  .saved-page-btn:disabled { opacity: .4; cursor: not-allowed; }

  @media (max-width: 860px) {
    .saved-side { max-width: none; }
  }

  .result-box { background: #111; color: #eee; padding: 20px; border-radius: 12px; font-size: 13.5px; line-height: 1.6; margin-top: 12px; }
  pre { white-space: pre-wrap; word-break: break-word; margin: 0; color: #eee; font-size: 13.5px; line-height: 1.6; font-family: inherit; }
  .error { color: #c00; font-weight: 600; }

  .result-tabs { display: flex; gap: 6px; margin-top: 24px; }
  .tab-btn { padding: 8px 16px; border: 1px solid #ccc; border-bottom: none; border-radius: 8px 8px 0 0; background: #e4e4e7; color: #444; font-size: 13px; cursor: pointer; }
  .tab-btn.active { background: #fff; color: #111; font-weight: 700; }
  .result-box, .pdf-view { margin-top: 0; border-radius: 0 12px 12px 12px; }

  .pdf-view { display: none; }
  .pdf-card { background: #fff; color: #000; padding: 20px; border-radius: 0 12px 12px 12px; border: 1px solid #ccc; font-family: 'Malgun Gothic', sans-serif; margin-bottom: 16px; }
  .pdf-card:last-child { margin-bottom: 0; }
  .pdf-header { padding: 0 2px 12px; margin-bottom: 14px; border-bottom: 1px solid #e4e4e7; }
  .pdf-header-name { font-size: 19px; font-weight: 700; color: #000; }
  .pdf-header-info { font-size: 12px; color: #666; margin-top: 3px; }
  .pdf-card-a { background: #f0f6ff; }
  .pdf-card-a .pdf-header-name { color: #1d4ed8; }
  .pdf-card-a .pdf-header { border-bottom-color: #c9dcfb; }
  .pdf-card-b { background: #fff4f0; }
  .pdf-card-b .pdf-header-name { color: #c2410c; }
  .pdf-card-b .pdf-header { border-bottom-color: #f7d9cc; }
  .pdf-table { border-collapse: collapse; width: 100%; margin-bottom: 22px; font-size: 13px; border: 1.5px solid #333; font-family: 'Malgun Gothic', sans-serif; }
  .pdf-table caption { caption-side: top; text-align: left; font-weight: 700; font-size: 14px; margin-bottom: 6px; color: #000; }
  .pdf-table th, .pdf-table td { border: 0.5px solid #ccc; padding: 8px 10px; text-align: center; color: #000; background: #fff; }
  .pdf-table thead th { background: #f2f2f2; font-weight: 700; }
  .pdf-wonguk-label { background: #f2f2f2; font-weight: 700; text-align: left; white-space: nowrap; width: 1%; }
  .pdf-wonguk thead th:nth-child(3), .pdf-wonguk tbody td:nth-child(3) { background: #fffbe8; }
  .pdf-big { font-size: 27px; font-weight: 700; }
  .pdf-hanja-main { line-height: 1.2; }
  .pdf-hanja-sub { font-size: 13px; font-weight: 400; color: #888; line-height: 1.3; margin-top: 2px; }
  .hide-hangul-sub .pdf-hanja-sub { display: none; }
  .hangul-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #444; margin-left: auto; cursor: pointer; user-select: none; }

  .color-tile { width: 52px; height: 52px; margin: 0 auto; border-radius: 4px; border: 1px solid #333; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; }
  .tile-mok { background: #2e9e4f; color: #fff; }
  .tile-hwa { background: #d23c3c; color: #fff; }
  .tile-to { background: #e0a92e; color: #fff; }
  .tile-geum { background: #fff; color: #333; border-width: 2px; }
  .tile-su { background: #3a3a3a; color: #fff; }
  .pdf-jijanggan-cell div { line-height: 1.5; }
  .pdf-jijanggan-cell div:not(:last-child) { border-bottom: 1px dashed #ccc; padding-bottom: 2px; margin-bottom: 2px; }
  tr.pdf-current td { background: #fff2b8; font-weight: 700; }
  .pdf-sgy td { text-align: left; }
  .pdf-gunghap td { text-align: left; }
  .pdf-gunghap td div:not(:last-child) { margin-bottom: 3px; }
  .gunghap-relation-label { font-weight: 700; font-size: 16px; margin-bottom: 10px; color: #000; }
  .gunghap-person-label { font-weight: 700; font-size: 15px; margin: 18px 0 6px; color: #000; }

  .el-mok { color: #2e7d32; }
  .el-hwa { color: #c62828; }
  .el-to { color: #a06a00; }
  .el-geum { color: #757575; }
  .el-su { color: #1a237e; }
  .pdf-gwiin { color: #1565c0; }
  .pdf-sal { color: #b71c1c; }
  .pdf-gongmang { color: #000; font-weight: 700; }

  .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #refreshBtn { background: #fff; color: #333; border: 1px solid #ccc; padding: 7px 14px; font-size: 13px; }
  #refreshBtn:hover { background: #f2f2f2; }

  .mode-tabs { display: flex; gap: 8px; margin: 14px 0; }
  .mode-tab-btn { padding: 8px 18px; border: 1px solid #ccc; border-radius: 8px; background: #fff; color: #444; font-size: 14px; font-weight: 600; cursor: pointer; }
  .mode-tab-btn.active { background: #0071e3; color: #fff; border-color: #0071e3; }

  .gunghap-person-block { border: 1px solid #e4e4e7; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
  .gunghap-person-title { font-weight: 700; font-size: 13px; color: #333; margin-bottom: 8px; }
  .gunghap-block-a { background: #f0f6ff; border-color: #d6e6ff; }
  .gunghap-block-a .gunghap-person-title { color: #1d4ed8; }
  .gunghap-block-b { background: #fff4f0; border-color: #ffe0d3; }
  .gunghap-block-b .gunghap-person-title { color: #c2410c; }
  /* ── 빠른 입력(문의글 붙여넣기) ── */
  .quick-box { border: 2px solid #7c3aed; background: #faf5ff; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; }
  .quick-box h2 { margin: 0 0 4px; font-size: 15px; color: #6b21a8; }
  .quick-box .quick-desc { margin: 0 0 8px; font-size: 12px; color: #7e6a94; }
  .quick-box textarea { width: 100%; box-sizing: border-box; border: 1px solid #c4b5fd; border-radius: 6px; padding: 8px; font-size: 14px; font-family: inherit; resize: vertical; }
  .quick-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .quick-actions button { padding: 8px 14px; border-radius: 6px; border: 1px solid #7c3aed; background: #fff; color: #6b21a8; font-size: 13px; cursor: pointer; }
  .quick-actions button.primary { background: #7c3aed; color: #fff; }
  .quick-actions button:hover { opacity: .85; }
  .quick-summary { display: none; margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: #fff; border: 1px solid #ddd6fe; font-size: 13px; line-height: 1.7; color: #333; }
  .quick-summary.error { background: #fef2f2; border-color: #fecaca; color: #b91c1c; }
  .quick-summary .qs-warn { color: #b45309; }
  .quick-summary b { color: #6b21a8; }
</style>
</head>
<body>
  <div class="top-bar">
    <h1>사주 명식 엔진</h1>
    <button type="button" id="refreshBtn">새로고침</button>
  </div>
  <p class="desc">이름·성별·생일·달력·윤달·생시를 입력하고 버튼을 눌러 명식표를 생성합니다.</p>

  <div class="mode-tabs">
    <button type="button" class="mode-tab-btn active" id="modeIndividual">개인 사주</button>
    <button type="button" class="mode-tab-btn" id="modeGunghap">궁합</button>
  </div>

  <div class="layout">
  <div class="form-panel">
  <div class="quick-box" id="quickBox">
    <h2>빠른 입력 (문의글 붙여넣기)</h2>
    <p class="quick-desc">스레드/DM에서 받은 문의글을 그대로 붙여넣으면 생년월일 · 성별 · 양음력 · 생시 · 고민내용을 자동으로 분해해서 아래 폼에 채워줍니다.</p>
    <textarea id="quickInput" rows="3" placeholder="예) 1989년 8월10일 여자 양력 오전 9시30분 결혼할만한 남자가 생길까요? 혼자살아야할 팔자인지요.."></textarea>
    <div class="quick-actions">
      <button type="button" class="primary" id="quickFillRunBtn">자동입력 + 바로 분석</button>
      <button type="button" id="quickFillBtn">자동입력만</button>
      <button type="button" id="quickClearBtn">비우기</button>
    </div>
    <div class="quick-summary" id="quickSummary"></div>
  </div>
  <form id="form">
    <div class="row">
      <div class="field">
        <label for="name">이름</label>
        <input type="text" id="name" placeholder="이름">
      </div>
      <div class="field">
        <label for="gender">성별</label>
        <select id="gender">
          <option value="male">남자</option>
          <option value="female">여자</option>
        </select>
      </div>
      <div class="field">
        <label for="birth">생일</label>
        <input type="text" id="birth" inputmode="numeric" maxlength="8" placeholder="YYYYMMDD">
      </div>
      <div class="field">
        <label for="calendar">달력</label>
        <select id="calendar">
          <option value="solar">양력</option>
          <option value="lunar">음력</option>
        </select>
      </div>
      <div class="field">
        <label for="leap">윤달</label>
        <select id="leap">
          <option value="false">평달</option>
          <option value="true">윤달</option>
        </select>
      </div>
      <div class="field">
        <label for="time">생시</label>
        <input type="text" id="time" inputmode="numeric" maxlength="4" placeholder="HHMM">
      </div>
      <div class="field or-field">
        <span class="or-text">또는</span>
      </div>
      <div class="field">
        <label for="ganjiSelect">간지선택</label>
        <select id="ganjiSelect">
          <option value="선택안함">선택안함</option>
          <option value="자시(子時) 23:30~01:30">자시(子時) 23:30~01:30</option>
          <option value="축시(丑時) 01:30~03:30">축시(丑時) 01:30~03:30</option>
          <option value="인시(寅時) 03:30~05:30">인시(寅時) 03:30~05:30</option>
          <option value="묘시(卯時) 05:30~07:30">묘시(卯時) 05:30~07:30</option>
          <option value="진시(辰時) 07:30~09:30">진시(辰時) 07:30~09:30</option>
          <option value="사시(巳時) 09:30~11:30">사시(巳時) 09:30~11:30</option>
          <option value="오시(午時) 11:30~13:30">오시(午時) 11:30~13:30</option>
          <option value="미시(未時) 13:30~15:30">미시(未時) 13:30~15:30</option>
          <option value="신시(申時) 15:30~17:30">신시(申時) 15:30~17:30</option>
          <option value="유시(酉時) 17:30~19:30">유시(酉時) 17:30~19:30</option>
          <option value="술시(戌時) 19:30~21:30">술시(戌時) 19:30~21:30</option>
          <option value="해시(亥時) 21:30~23:30">해시(亥時) 21:30~23:30</option>
        </select>
      </div>
      <div class="field checkbox-field">
        <input type="checkbox" id="hourUnknown">
        <label for="hourUnknown">생시모름</label>
      </div>
      <div class="field">
        <label for="birthRegionSearch">출생지역</label>
        <input type="text" id="birthRegionSearch" class="region-search-input" placeholder="지역명 검색 (예: 서울)" autocomplete="off">
        <div class="region-suggest" id="birthRegionSuggest"></div>
        <div class="region-warning" id="birthRegionWarning">목록에서 지역을 선택하세요</div>
      </div>
      <div class="field">
        <label for="birthCorrectionManual">보정(분)</label>
        <input type="number" id="birthCorrectionManual" class="region-manual-input" placeholder="예: -23" step="1">
      </div>
      <div class="field">
        <label for="seyunRange">세운</label>
        <select id="seyunRange">
          <option value="5">5년</option>
          <option value="10">10년</option>
        </select>
      </div>
      <div class="field">
        <label for="wolunRange">월운</label>
        <select id="wolunRange">
          <option value="12">12개월</option>
          <option value="24">24개월</option>
          <option value="36">36개월</option>
        </select>
      </div>
      <div class="field">
        <label for="loveStatus">연애상태</label>
        <select id="loveStatus">
          <option value="선택안함">선택안함</option>
          <option value="싱글">싱글</option>
          <option value="연애중">연애중</option>
          <option value="기혼">기혼</option>
          <option value="이별·재회고민">이별·재회고민</option>
        </select>
      </div>
    </div>

    <div class="field concern-field">
      <label for="concern">고민</label>
      <textarea id="concern" rows="3" placeholder="고민 내용을 입력하세요 (선택)"></textarea>
    </div>

    <div id="formError" class="form-error" style="display:none;"></div>

    <div class="actions">
      <button type="button" class="btn-jeong" id="btnJeong">사주분석 (정)</button>
      <button type="button" class="btn-ya" id="btnYa">사주분석 (야)</button>
      <button type="button" class="secondary" id="saveBtn">저장하기</button>
    </div>
  </form>

  <form id="gunghapForm" style="display:none;">
    <div class="gunghap-person-block gunghap-block-a">
      <div class="gunghap-person-title">본인(의뢰인)</div>
      <div class="row">
        <div class="field">
          <label for="p1_name">이름</label>
          <input type="text" id="p1_name" placeholder="이름">
        </div>
        <div class="field">
          <label for="p1_gender">성별</label>
          <select id="p1_gender">
            <option value="male">남자</option>
            <option value="female">여자</option>
          </select>
        </div>
        <div class="field">
          <label for="p1_birth">생일</label>
          <input type="text" id="p1_birth" inputmode="numeric" maxlength="8" placeholder="YYYYMMDD">
        </div>
        <div class="field">
          <label for="p1_calendar">달력</label>
          <select id="p1_calendar">
            <option value="solar">양력</option>
            <option value="lunar">음력</option>
          </select>
        </div>
        <div class="field">
          <label for="p1_leap">윤달</label>
          <select id="p1_leap">
            <option value="false">평달</option>
            <option value="true">윤달</option>
          </select>
        </div>
        <div class="field">
          <label for="p1_time">생시</label>
          <input type="text" id="p1_time" inputmode="numeric" maxlength="4" placeholder="HHMM">
        </div>
        <div class="field or-field">
          <span class="or-text">또는</span>
        </div>
        <div class="field">
          <label for="p1_ganjiSelect">간지선택</label>
          <select id="p1_ganjiSelect">
            <option value="선택안함">선택안함</option>
            <option value="자시(子時) 23:30~01:30">자시(子時) 23:30~01:30</option>
            <option value="축시(丑時) 01:30~03:30">축시(丑時) 01:30~03:30</option>
            <option value="인시(寅時) 03:30~05:30">인시(寅時) 03:30~05:30</option>
            <option value="묘시(卯時) 05:30~07:30">묘시(卯時) 05:30~07:30</option>

// ── 출생지역 검색 자동완성 (외부 지도 API 없이 서버가 내려주는 내장 regions.ts 데이터만 사용) ──
let REGIONS = [];
async function loadRegions() {
  try {
    const res = await fetch('/api/regions');
    const data = await res.json();
    REGIONS = data.regions || [];
  } catch (err) {
    REGIONS = [];
  }
}
function formatCorrection(n) {
  return (n > 0 ? '+' : '') + n + '분';
}

// 개인 모드(prefix='')와 궁합 모드 본인/상대(prefix='p1_'/'p2_')가 공유하는 출생지역 검색/보정(분) 위젯.
// 계산에 쓰이는 값은 오직 보정(분) 칸뿐이다. 출생지역 칸은 표시·기록용이며, 목록에서 항목을
// 클릭하면 보정(분) 칸에 그 값을 자동으로 채워줄 뿐이다(그 뒤에도 보정(분) 칸은 자유롭게 고칠 수 있고,
// 그렇게 고친 값이 그대로 우선 적용된다). 지역 칸에 글자만 있고 보정(분)이 비어 있으면(=선택을 안 한 것으로
// 간주) 보정이 적용되지 않으므로, 착각을 막기 위해 노란 테두리와 안내 문구로 표시한다.
function wireBirthRegion(prefix) {
  const searchEl = document.getElementById(prefix + 'birthRegionSearch');
  const suggestEl = document.getElementById(prefix + 'birthRegionSuggest');
  const manualEl = document.getElementById(prefix + 'birthCorrectionManual');
  const warnEl = document.getElementById(prefix + 'birthRegionWarning');

  const closeSuggest = () => { suggestEl.innerHTML = ''; suggestEl.classList.remove('open'); };

  const updateWarning = () => {
    const needsSelection = searchEl.value.trim() !== '' && manualEl.value.trim() === '';
    searchEl.classList.toggle('warn', needsSelection);
    if (warnEl) warnEl.classList.toggle('show', needsSelection);
  };

  const selectRegion = (region) => {
    searchEl.value = region.name;
    manualEl.value = String(region.correctionMinutes);
    closeSuggest();
    updateWarning();
  };

  const renderSuggestions = (query) => {
    const q = query.trim();
    if (!q) { closeSuggest(); return; }
    const matches = REGIONS.filter(r => r.name.includes(q)).slice(0, 20);
    if (!matches.length) { closeSuggest(); return; }
    suggestEl.innerHTML = '';
    matches.forEach(r => {
      const row = document.createElement('div');
      row.className = 'region-suggest-row';
      row.textContent = `${r.name} (${formatCorrection(r.correctionMinutes)})`;
      row.addEventListener('mousedown', (e) => { e.preventDefault(); selectRegion(r); });
      suggestEl.appendChild(row);
    });
    suggestEl.classList.add('open');
  };

  searchEl.addEventListener('input', () => {
    renderSuggestions(searchEl.value);
    updateWarning();
  });
  searchEl.addEventListener('focus', () => { if (searchEl.value.trim()) renderSuggestions(searchEl.value); });
  searchEl.addEventListener('blur', () => setTimeout(closeSuggest, 150));

  manualEl.addEventListener('input', updateWarning);
}

// 저장/전송용: 계산에는 보정(분) 칸의 값만 쓰고, 지역명은 그 값과 함께 표시·기록용으로만 실어 보낸다.
// 보정(분)이 비어있거나 0이면(기본값) undefined를 돌려줘 보정 없음으로 처리된다.
function getBirthRegionData(prefix) {
  const searchEl = document.getElementById(prefix + 'birthRegionSearch');
  const manualEl = document.getElementById(prefix + 'birthCorrectionManual');
  const manualVal = manualEl.value.trim();
  if (manualVal === '' || Number.isNaN(Number(manualVal)) || Number(manualVal) === 0) {
    return { correctionMinutes: undefined, birthRegionLabel: undefined };
  }
  return { correctionMinutes: Math.round(Number(manualVal)), birthRegionLabel: searchEl.value.trim() || undefined };
}

// 저장된 사주 불러오기용: p.correctionMinutes/birthRegionLabel로 두 칸을 그대로 복원한다.
function setBirthRegionFields(prefix, p) {
  const searchEl = document.getElementById(prefix + 'birthRegionSearch');
  const manualEl = document.getElementById(prefix + 'birthCorrectionManual');
  const warnEl = document.getElementById(prefix + 'birthRegionWarning');
  searchEl.value = p.birthRegionLabel || '';
  manualEl.value = (typeof p.correctionMinutes === 'number' && p.correctionMinutes !== 0) ? String(p.correctionMinutes) : '';
  searchEl.classList.remove('warn');
  if (warnEl) warnEl.classList.remove('show');
}

loadRegions();

function showFormError(msg) {
  formErrorDiv.textContent = msg;

}

// 개인 모드(prefix='')와 궁합 모드 본인/상대(prefix='p1_'/'p2_')가 공유하는 생일·생시 파싱.
function parseBirthAndTime(prefix, showErrorFn) {
  const birthEl = document.getElementById(prefix + 'birth');
  const timeEl = document.getElementById(prefix + 'time');
  const hourUnknownEl = document.getElementById(prefix + 'hourUnknown');
  const ganjiEl = document.getElementById(prefix + 'ganjiSelect');

  const birth = birthEl.value.trim();
  if (!/^\d{8}$/.test(birth)) {
    showErrorFn('생일은 8자리 숫자로 입력해주세요 (예: 19740426)');
    return null;
  }
  const year = parseInt(birth.slice(0, 4), 10);
  const month = parseInt(birth.slice(4, 6), 10);
  const day = parseInt(birth.slice(6, 8), 10);
  if (month < 1 || month > 12 || day < 1 || day > 31) {
    showErrorFn('생일 숫자가 올바르지 않습니다 (예: 19740426)');
    return null;
  }

  const hourUnknown = hourUnknownEl.checked;
  let hour = 0, minute = 0;
  const ganji = ganjiEl.value !== '선택안함' ? ganjiEl.value : '';
  if (!hourUnknown && ganji) {
    [hour, minute] = GANJI_TIME_MAP[ganji];
  } else if (!hourUnknown) {
    const time = timeEl.value.trim();
    if (!/^\d{4}$/.test(time)) {
      showErrorFn('생시는 4자리 숫자로 입력해주세요 (예: 1000), 모르면 "생시모름"을 체크하거나 간지선택을 이용하세요');
      return null;
    }
    hour = parseInt(time.slice(0, 2), 10);
    minute = parseInt(time.slice(2, 4), 10);
    if (hour > 23 || minute > 59) {
      showErrorFn('생시 숫자가 올바르지 않습니다 (00:00~23:59, 예: 1000)');
      return null;
    }
  }

  return { year, month, day, hour, minute, hourUnknown, ganjiSelect: hourUnknown ? '' : ganji };
}

function collectFormData() {
  clearFormError();
  const bt = parseBirthAndTime('', showFormError);
  if (!bt) return null;

  return {
    name: document.getElementById('name').value,
    ...bt,
    isLunar: document.getElementById('calendar').value === 'lunar',
    isLeapMonth: document.getElementById('leap').value === 'true',
    gender: document.getElementById('gender').value,
    concern: document.getElementById('concern').value,
    ...getBirthRegionData(''),
    세운년수: parseInt(document.getElementById('seyunRange').value, 10),
    월운개월수: parseInt(document.getElementById('wolunRange').value, 10),
    연애상태: document.getElementById('loveStatus').value,
  };
}

function buildPayload(jasi) {
  const data = collectFormData();
  if (!data) return null;
  return { ...data, jasi };
}

// 궁합 모드: 본인(p1_)/상대(p2_) 필드셋 공용 수집. 세운/월운/연애상태는 궁합 모드에 없다.
function collectPersonFields(prefix, showErrorFn) {
  const bt = parseBirthAndTime(prefix, showErrorFn);
  if (!bt) return null;
  return {
    name: document.getElementById(prefix + 'name').value,
    ...bt,
    isLunar: document.getElementById(prefix + 'calendar').value === 'lunar',
    isLeapMonth: document.getElementById(prefix + 'leap').value === 'true',
    gender: document.getElementById(prefix + 'gender').value,
    ...getBirthRegionData(prefix),
  };
}

function wireTimeControls(prefix) {
  const timeEl = document.getElementById(prefix + 'time');

    timeEl.disabled = checked;
    ganjiEl.disabled = checked;

  ganjiEl.addEventListener('change', () => {
    const active = ganjiEl.value !== '선택안함';
    timeEl.disabled = active;
    if (active) timeEl.value = '';
  });
  timeEl.addEventListener('input', () => {
    if (timeEl.value.trim() && ganjiEl.value !== '선택안함') ganjiEl.value = '선택안함';
  });
}

// 개인 모드/궁합 모드 공용: 계산 결과(text/pdfHtml/colorHtml)를 결과 탭 3개로 렌더링한다.
function renderResultTabs(data) {
  resultDiv.innerHTML =
    '<div class="result-tabs">' +

function flashBtnMessage(btn, msg, ms) {
  const original = btn.dataset.label || btn.textContent;
  btn.dataset.label = original;
  btn.textContent = msg;
  clearTimeout(btn._resetTimer);
  btn._resetTimer = setTimeout(() => { btn.textContent = original; }, ms || 1500);
}

async function copyToButton(btn) {
  if (!lastText || btn.disabled) return;
  try {
    await navigator.clipboard.writeText(lastText);
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = lastText;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
  flashBtnMessage(btn, '복사됐습니다');
}

downloadBtn.addEventListener('click', () => {
  if (!lastText || downloadBtn.disabled) return;
  const blob = new Blob([lastText], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = lastName ? ('명식표_' + lastName + '.txt') : '명식표.txt';

});

function buildImageFilename() {
  const parts = [];
  if (lastName) parts.push(lastName);
  if (lastBirth) parts.push(lastBirth);
  parts.push(activeResultTab === 'color' ? '컬러명식표' : '명식표');

function renderPdfCanvas() {
  const targetId = activeResultTab === 'color' ? 'colorCaptureArea' : 'pdfCaptureArea';
  const target = document.getElementById(targetId);
  return html2canvas(target, { backgroundColor: '#ffffff', scale: 2 });
}

function canvasToPngBlob(canvas) {
  return new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
}

async function copyPdfImage(btn) {
  if (btn.disabled) return;
  if (!(navigator.clipboard && window.ClipboardItem)) {
    flashBtnMessage(btn, '복사가 지원되지 않아요. 이미지 저장을 이용해주세요', 2500);
    return;
  }
  try {
    const canvas = await renderPdfCanvas();
    const blob = await canvasToPngBlob(canvas);
    await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
    flashBtnMessage(btn, '이미지가 복사됐습니다');
  } catch (err) {
    flashBtnMessage(btn, '복사가 지원되지 않아요. 이미지 저장을 이용해주세요', 2500);
  }
}

async function savePdfImage(btn) {
  if (btn.disabled) return;
  try {
    const canvas = await renderPdfCanvas();
    const blob = await canvasToPngBlob(canvas);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = buildImageFilename();
    a.click();
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('이미지 저장 중 오류: ' + err.message);
  }
}

// 개인 모드에서는 type==='개인' 항목만, 궁합 모드에서는 type==='궁합' 항목만 보이도록 완전히 분리한다.
function currentSavedType() {
  return currentMode === 'gunghap' ? '궁합' : '개인';
}

function savedItemLabel(p) {
  if (p.type === '궁합') {
    const n1 = (p.person1 && p.person1.name) || '이름없음';
    const n2 = (p.person2 && p.person2.name) || '이름없음';
    return n1 + ' × ' + n2 + ' [' + (p.relationType || '') + '] · ' + formatSavedAt(p.savedAt);
  }
  return (p.name || '이름없음') + ' (' + formatBirth(p) + ') · ' + formatSavedAt(p.savedAt);
}

function filteredSavedProfiles() {
  const type = currentSavedType();
  const q = savedSearchQuery.trim();
  return allSavedProfiles.filter(p => {
    if (p.type !== type) return false;
    if (!q) return true;
    if (type === '궁합') {
      const n1 = (p.person1 && p.person1.name) || '';
      const n2 = (p.person2 && p.person2.name) || '';
      return n1.includes(q) || n2.includes(q);
    }
    return (p.name || '').includes(q);
  });
}

function renderSavedSide() {
  const list = filteredSavedProfiles();
  const totalPages = Math.max(1, Math.ceil(list.length / SAVED_PAGE_SIZE));
  if (savedCurrentPage > totalPages) savedCurrentPage = totalPages;
  const startIdx = (savedCurrentPage - 1) * SAVED_PAGE_SIZE;
  const pageItems = list.slice(startIdx, startIdx + SAVED_PAGE_SIZE);

  savedListEl.innerHTML = '';
  if (!pageItems.length) {
    const msg = allSavedProfiles.length === 0 ? '저장된 사주가 없습니다' : (list.length === 0 ? '검색 결과가 없습니다' : '해당 페이지에 항목이 없습니다');
    savedListEl.innerHTML = '<div class="saved-empty">' + msg + '</div>';
    renderSavedPagination(0);
    return;
  }

  pageItems.forEach(p => {
    const row = document.createElement('div');
    row.className = 'saved-item';

    const label = document.createElement('span');
    label.className = 'saved-item-label';
    label.textContent = savedItemLabel(p);
    label.addEventListener('click', () => {
      if (p.type === '궁합') loadGunghapProfileIntoForm(p);
      else loadProfileIntoForm(p);
    });

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'saved-item-delete';
    delBtn.title = '삭제';
    delBtn.textContent = '🗑';
    delBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm(savedItemLabel(p) + ' 항목을 삭제할까요?')) return;
      await fetch('/api/saved?filename=' + encodeURIComponent(p.filename), { method: 'DELETE' });
      await loadSavedList();
    });

    row.appendChild(label);
    row.appendChild(delBtn);
    savedListEl.appendChild(row);
  });

  renderSavedPagination(totalPages);
}

function renderSavedPagination(totalPages) {
  savedPaginationEl.innerHTML = '';
  if (totalPages <= 1) return;

  const mkBtn = (label, page, opts) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'saved-page-btn' + ((opts && opts.active) ? ' active' : '');
    btn.textContent = label;
    btn.disabled = !!(opts && opts.disabled);
    btn.addEventListener('click', () => { savedCurrentPage = page; renderSavedSide(); });
    return btn;
  };

  savedPaginationEl.appendChild(mkBtn('이전', savedCurrentPage - 1, { disabled: savedCurrentPage <= 1 }));
  for (let i = 1; i <= totalPages; i++) savedPaginationEl.appendChild(mkBtn(String(i), i, { active: i === savedCurrentPage }));
  savedPaginationEl.appendChild(mkBtn('다음', savedCurrentPage + 1, { disabled: savedCurrentPage >= totalPages }));
}

savedSearchEl.addEventListener('input', () => {
  savedSearchQuery = savedSearchEl.value;
  savedCurrentPage = 1;
  renderSavedSide();
});

// ── 빠른 입력 파서: 스레드/DM 문의글 원문 → 폼 값 자동 분해 ──
const QUICK_GANJI_CHARS = ['자','축','인','묘','진','사','오','미','신','유','술','해'];

function quickParse(raw) {
  let rest = ' ' + String(raw).replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim() + ' ';
  const out = { warnings: [] };

  const blank = (m) => {
    if (!m) return;
    rest = rest.slice(0, m.index) + ' '.repeat(m[0].length) + rest.slice(m.index + m[0].length);
  };
  const blankRange = (idx, len) => {
    rest = rest.slice(0, idx) + ' '.repeat(len) + rest.slice(idx + len);
  };

  // ── 1. 생년월일 ──
  const nowYY = new Date().getFullYear() % 100;
  const dateForms = [
    { re: /(\d{4})\s*[년.\-\/]\s*(\d{1,2})\s*[월.\-\/]\s*(\d{1,2})\s*(?:일)?\s*(?:생)?/, four: true },
    { re: /(\d{2})\s*[년.\-\/]\s*(\d{1,2})\s*[월.\-\/]\s*(\d{1,2})\s*(?:일)?\s*(?:생)?/, four: false },
    { re: /(?:^|\D)(\d{4})(\d{2})(\d{2})(?:\D|$)/, four: true, offset: true },
    { re: /(?:^|\D)(\d{2})(\d{2})(\d{2})(?:\D|$)/, four: false, offset: true },
  ];
  for (const f of dateForms) {
    const m = rest.match(f.re);
    if (!m) continue;
    let y = Number(m[1]);
    const mo = Number(m[2]);
    const d = Number(m[3]);
    if (!f.four) y = y <= nowYY ? 2000 + y : 1900 + y;
    if (y < 1900 || y > 2100 || mo < 1 || mo > 12 || d < 1 || d > 31) continue;
    out.year = y; out.month = mo; out.day = d;
    out.birth = String(y) + String(mo).padStart(2, '0') + String(d).padStart(2, '0');
    // 앞뒤 경계 문자는 지우지 않도록 실제 숫자 구간만 blank 처리
    const inner = m[0].replace(/^\D+/, '');
    blankRange(m.index + (m[0].length - inner.length), inner.length);
    break;
  }

  // ── 2. 달력(양/음) · 윤달 ──
  const leapM = rest.match(/윤\s*달/);
  const lunarM = rest.match(/음\s*력/);
  const solarM = rest.match(/양\s*력/);
  if (lunarM || leapM) {
    out.calendar = 'lunar';
    blank(lunarM); blank(leapM); blank(solarM);
    out.leap = !!leapM;
  } else if (solarM) {
    out.calendar = 'solar';
    out.leap = false;
    blank(solarM);
  } else {
    out.calendar = 'solar';
    out.leap = false;
    out.warnings.push('양력/음력 표기가 없어 <b>양력</b>으로 넣었어요. 음력이면 직접 바꿔주세요.');
  }

  // ── 3. 성별 ──
  let gm = rest.match(/(여자|여성|여아|남자|남성|남아)/);
  if (gm) {
    out.gender = gm[1][0] === '여' ? 'female' : 'male';
    blank(gm);
  } else {
    gm = rest.match(/(?:^|[\s,\/(\[])([남여])(?=[\s,\/)\]]|$)/);
    if (gm) {
      out.gender = gm[1] === '여' ? 'female' : 'male';
      blankRange(rest.indexOf(gm[1], gm.index), 1);
    } else {
      out.warnings.push('성별을 못 찾아서 <b>남자</b>로 뒀어요. 확인해주세요.');
      out.gender = 'male';
    }
  }

  // ── 4. 생시 ──
  const noonM = rest.match(/(정오|자정)/);
  const timeM = rest.match(/(오전|오후|새벽|아침|낮|저녁|밤)?\s*(\d{1,2})\s*(?:시(?!간)|:)\s*(?:(\d{1,2})\s*분?|(반))?/);
  if (noonM && !timeM) {
    out.hour = noonM[1] === '정오' ? 12 : 0;
    out.minute = 0;
    blank(noonM);
  } else if (timeM) {
    let h = Number(timeM[2]);
    let mi = timeM[4] ? 30 : (timeM[3] ? Number(timeM[3]) : 0);
    const mark = timeM[1] || '';
    if (h <= 24 && mi <= 59) {
      if (mark === '오후' || mark === '저녁') { if (h < 12) h += 12; }
      else if (mark === '밤') { h = h === 12 ? 0 : (h < 12 ? h + 12 : h); }
      else if (mark === '낮') { if (h < 8) h += 12; }
      else if (mark === '오전' || mark === '새벽' || mark === '아침') { if (h === 12) h = 0; }
      if (h === 24) h = 0;
      if (h <= 23) {
        out.hour = h; out.minute = mi;
        if (!mark && h < 12) out.warnings.push('오전/오후 표기가 없어 <b>' + String(h).padStart(2,'0') + ':' + String(mi).padStart(2,'0') + '</b>(24시 기준)로 넣었어요.');
        blank(timeM);
      }
    }
  }
  if (out.hour === undefined) {
    // 시진(간지) 표기
    const gj = rest.match(/(?:^|[\s,(\[])([자축인묘진사오미신유술해])\s*시(?!간)/);
    if (gj && QUICK_GANJI_CHARS.includes(gj[1])) {
      out.ganjiChar = gj[1];
      blankRange(rest.indexOf(gj[1], gj.index), gj[0].length - (gj[0].indexOf(gj[1])));
    } else if (/(시간|생시|시)\s*(?:은|는|을|를)?\s*(?:모름|모릅|모르|미상|불명|몰라)/.test(rest) || /(모름|미상|몰라요|모릅니다|모르겠)/.test(rest)) {
      out.hourUnknown = true;
      const um = rest.match(/(?:출생\s*)?(?:시간|생시|태어난\s*시간?)?\s*(?:은|는|을|를)?\s*(?:모름|모릅니다|모르겠어요|모르겠음|모르겠습니다|몰라요|미상|불명)/);
      blank(um);
    } else {
      out.hourUnknown = true;
      out.warnings.push('생시를 못 찾아서 <b>생시모름</b>으로 뒀어요.');
    }
  }

  // ── 5. 출생지역 (진태양시 보정) ──
  if (REGIONS.length) {
    const cands = REGIONS.map(r => ({
      r,
      alias: r.name.replace(/(특별자치시|특별자치도|특별시|광역시|자치시|자치도|시|군|도)$/, '')
    })).filter(x => x.alias.length >= 2).sort((a, b) => b.alias.length - a.alias.length);
    const isHangul = (ch) => !!ch && /[가-힣]/.test(ch);
    const OK_NEXT = '시군도특광에서출생태어';
    for (const c of cands) {
      const idx = rest.indexOf(c.alias);
      if (idx < 0) continue;
      const prev = rest[idx - 1];
      const next = rest[idx + c.alias.length];
      if (isHangul(prev)) continue;
      if (isHangul(next) && OK_NEXT.indexOf(next) < 0) continue;
      out.region = c.r;
      blankRange(idx, c.alias.length);
      break;
    }
  }

  // ── 6. 이름 ──
  let nm = rest.match(/(?:이름|성함)\s*[:：]?\s*([가-힣]{2,4})/);
  if (nm) { out.name = nm[1]; blank(nm); }
  else {
    nm = rest.match(/^\s*([가-힣]{2,4})\s*(?:님|씨)(?![가-힣])/);
    if (nm) { out.name = nm[1]; blank(nm); }
  }

  // ── 7. 남은 텍스트 = 고민 내용 ──
  out.concern = rest
    .replace(/\s+/g, ' ')
    .replace(/^[\s,.\/·\-|()\[\]]+/, '')
    .replace(/[\s,·\-|]+$/, '')
    .trim();

  return out;
}


// ── 빠른 입력: 파싱 결과를 실제 폼에 반영 ──
const quickInputEl = document.getElementById('quickInput');
const quickSummaryEl = document.getElementById('quickSummary');

function quickShow(html, isError) {
  quickSummaryEl.innerHTML = html;
  quickSummaryEl.className = 'quick-summary' + (isError ? ' error' : '');
  quickSummaryEl.style.display = 'block';
}

function quickApply() {
  const raw = quickInputEl.value.trim();
  if (!raw) { quickShow('붙여넣은 내용이 없습니다.', true); return false; }

  const p = quickParse(raw);
  if (!p.birth) {
    quickShow('생년월일을 찾지 못했습니다. (인식 가능한 형식: 1989년 8월 10일 / 1989.8.10 / 19890810 / 89년 8월 10일)', true);
    return false;
  }

  document.getElementById('name').value = p.name || '';
  document.getElementById('gender').value = p.gender;
  document.getElementById('birth').value = p.birth;
  document.getElementById('calendar').value = p.calendar;
  document.getElementById('leap').value = p.leap ? 'true' : 'false';
  document.getElementById('concern').value = p.concern || '';

  // 생시: 모름 → 간지 → 숫자 순서로 초기화 후 반영
  hourUnknownCheckbox.checked = false;
  hourUnknownCheckbox.dispatchEvent(new Event('change'));
  ganjiSelect.value = '선택안함';
  ganjiSelect.dispatchEvent(new Event('change'));
  timeInput.value = '';

  let timeLabel = '';
  if (p.hourUnknown) {
    hourUnknownCheckbox.checked = true;
    hourUnknownCheckbox.dispatchEvent(new Event('change'));
    timeLabel = '생시모름';
  } else if (p.ganjiChar) {
    const opt = Array.from(ganjiSelect.options).find(o => o.value.startsWith(p.ganjiChar + '시'));
    if (opt) {
      ganjiSelect.value = opt.value;
      ganjiSelect.dispatchEvent(new Event('change'));
      timeLabel = opt.value;
    }
  } else if (p.hour !== undefined) {
    timeInput.value = String(p.hour).padStart(2, '0') + String(p.minute).padStart(2, '0');
    timeInput.dispatchEvent(new Event('input'));
    timeLabel = String(p.hour).padStart(2, '0') + ':' + String(p.minute).padStart(2, '0');
  }

  // 출생지역(진태양시 보정)
  let regionLabel = '없음';
  const rSearch = document.getElementById('birthRegionSearch');
  const rManual = document.getElementById('birthCorrectionManual');
  rSearch.value = '';
  rManual.value = '';
  rManual.dispatchEvent(new Event('input'));
  if (p.region) {
    rSearch.value = p.region.name;
    rManual.value = String(p.region.correctionMinutes);
    rManual.dispatchEvent(new Event('input'));
    regionLabel = p.region.name + ' (' + formatCorrection(p.region.correctionMinutes) + ')';
  }

  const rows = [
    '생년월일: <b>' + p.year + '년 ' + p.month + '월 ' + p.day + '일</b> (' + (p.calendar === 'lunar' ? '음력' + (p.leap ? ' 윤달' : '') : '양력') + ')',
    '성별: <b>' + (p.gender === 'female' ? '여자' : '남자') + '</b>',
    '생시: <b>' + (timeLabel || '없음') + '</b>',
    '출생지역: <b>' + regionLabel + '</b>',
    '고민: <b>' + (p.concern ? p.concern.replace(/</g, '&lt;') : '(없음)') + '</b>',
  ];
  const warns = p.warnings.map(w => '<div class="qs-warn">※ ' + w + '</div>').join('');
  quickShow(rows.join('<br>') + warns, false);
  clearFormError();
  return true;
}

document.getElementById('quickFillBtn').addEventListener('click', () => { quickApply(); });
document.getElementById('quickFillRunBtn').addEventListener('click', () => {
  if (quickApply()) runAnalysis('normal');
});
document.getElementById('quickClearBtn').addEventListener('click', () => {
  quickInputEl.value = '';
  quickSummaryEl.style.display = 'none';
  quickInputEl.focus();
});
// Ctrl+Enter = 자동입력 + 바로 분석
quickInputEl.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    if (quickApply()) runAnalysis('normal');
  }
});


loadSavedList();
</script>
